<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            border: 3px solid #8888FF;
            padding: 10px;
        }

        h2 {
            font-size: 24px;
        }

        fieldset {
            background-color: #DDDDFF;
            border: 2px groove #8888FF;
        }

        .field {
            margin-bottom: 2px;
        }

        .field label {
            display: inline-block;
            width: 140px;
            text-align: right;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h3>Register</h3>

    <form name="myForm" action="processData.php" method="POST">

        <fieldset>
            <legend><b>Person Details</b></legend>

            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" size="31">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" size="31">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password" size="31">
            </div>

            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" rows="3" cols="22"></textarea>
            </div>

            <div class="field">
                <label for="state">State</label>
                <select name="state">
                    <option value="-1" selected>choose your state</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>

            <div class="field">
                <input type="hidden" name="country" value="Australia">
            </div>

            <div class="field">
                <label for="sex">Gender</label>
                <input type="radio" name="sex" value="male">Male
                <input type="radio" name="sex" value="female">Female
            </div>

            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" value="Yes">
            </div>

            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" value="Submit" name="submit">
                <input type="reset" value="Reset" name="reset">
            </div>

        </fieldset>

    </form>
</body>
</html>
